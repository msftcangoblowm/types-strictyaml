# Install pre-commit hooks via
# python -m pip list | grep pre-commit
# python -m pip install pre-commit
# pre-commit install
# PRE_COMMIT_HOME=/tmp/.pre-commit

exclude: >
  (?x)^(
    \.vscode/settings\.json|
    tests/.*xml|
    tests/.*txt|
    strictyaml\_stubs/\_version\.py|
  )$

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: debug-statements
  - id: check-merge-conflict
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-docstring-first
  - id: check-json
  - id: check-yaml
  - id: check-toml

- repo: https://github.com/crate-ci/typos
  rev: v1
  hooks:
  - id: typos

- repo: https://github.com/abravalheri/validate-pyproject
  rev: v0.25
  hooks:
  - id: validate-pyproject

# py310+
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2', --preserve-quotes]

# py310+
# DO NOT USE Makefile until py39 support dropped
# 25.1.0 py39+ latest py310+ MUST MATCH requirements/dev.lock
- repo: https://github.com/psf/black
  rev: 26.3.1
  hooks:
  - id: black
    args: [--target-version, py310]

# DO NOT USE Makefile until py39 support dropped
# 0.3.9 py39+ latest py310+ MUST MATCH requirements/dev.lock
- repo: https://github.com/keewis/blackdoc
  rev: v0.4.6
  hooks:
  - id: blackdoc
    additional_dependencies: [black==26.3.1]
  - id: blackdoc-autoupdate-black

- repo: https://github.com/PyCQA/flake8
  rev: 7.3.0
  hooks:
  - id: flake8
    # args: ['--ignore=E701,E704,E203,W503,W605,W293,W291,E501']
    additional_dependencies: [flake8-pyproject]

- repo: https://github.com/PyCQA/isort
  rev: 9.0.0a3
  hooks:
  - id: isort

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.1.0
  hooks:
  - id: mypy
    pass_filenames: false
    entry: mypy strictyaml-stubs
    args: [--cache-dir, /tmp/.mypy_cache, --config-file, pyproject.toml]
    additional_dependencies: [pytest, pytest-mypy-plugins, strictyaml, types-lxml, types-jsonschema]

# https://github.com/RobertCraigie/pyright-python contains tracker
# pyright-python dependency: nodejs-wheel
# https://github.com/ducdetronquito/pyright-alright
- repo: https://github.com/RobertCraigie/pyright-python
  rev: v1.1.409
  hooks:
  - id: pyright
    name: Run pyright
    entry: bash -c 'exec env PYRIGHT_PYTHON_CACHE_DIR=/tmp/.cache/pyright PYRIGHT_PYTHON_FORCE_VERSION=latest pyright'
    language: python
    types: [file, python]
    additional_dependencies: [nodejs-wheel, pytest, pytest-mypy-plugins, strictyaml, types-lxml, types-jsonschema]

# To use tox, see https://tox.readthedocs.io
# run in parallel using `tox -p`
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox.ini -e rst2html5 --workdir=. -vvv; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox.ini -e pre-commit --workdir=. -vvv; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox.ini -e mypy --workdir=. -vvv; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox.ini -e pyright --workdir=. -vvv; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox.ini -e notice --workdir=. -vvv; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox.ini -e sbom --workdir=. -vvv; cd - &>/dev/null
[tox]
env_list =
    rst2html5, mypy, pyright, pre-commit, notice, sbom, lint, format
toxworkdir = {env:TOXWORKDIR:.tox}

[gh]
# `PYVERSIONS <https://pypi.org/project/tox-gh/>`_
# `Example with pypy3.10 <https://github.com/celery/kombu/blob/main/tox.ini>`_
python =
    3.10 = py310
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314
    pypy-3.10 = pypy310
    pypy-3.11 = pypy311

[base]
setenv =
    #PYTHONWARNINGS=ignore:removed in Python 3.14; use ast.Constant:DeprecationWarning
    # Disable CPython's color output
    PYTHON_COLORS=0
    TOXINIDIR = {toxinidir}
    DS_CONFIG_SETTINGS={temp_dir}{/}setuptools-build.toml
    # SKIP=mypy
passenv = *

[testenv]
usedevelop = False
download = True

basepython =
    rst2html5, pre-commit, preright, mypy, notice, sbom, lint, format: python3.10

deps =
    build
    wheel

# Windows can't update the pip version with pip running, so use Python
# to install things.
install_command = python -m pip install --disable-pip-version-check --find-links http://localhost:8081/simple/ --pre -I {opts} {packages}

# tox not recognizing config_settings passed via cli
# python -m build -C--kind="[tag | current]"
commands_pre =
    python -c 'from pathlib import Path; txt="[project]\nname = \"whatever\"\nversion = \"0.0.1\"\n\n[tool.config-settings]\nkind=\"tag\"\n"; p=Path("{temp_dir}{/}setuptools-build.toml"); p.write_text(txt)'

# build creates _version.py
commands =
    python -m build
    python -m pip install --disable-pip-version-check --no-deps -q .

[testenv:rst2html5]
description = README rst to html
skip_install = true
# Build the docs so we know if they are successful
# better alternative https://github.com/marianoguerra/rst2html5
deps =
    -r requirements/rst2html5.lock
commands =
    rst2html5 --strict README.rst "{toxworkdir}{/}README.html"

[testenv:pre-commit]
description = Run pre-commit
skip_install = true
deps =
    -r requirements/manage.unlock
    nodejs-wheel
setenv =
    SKIP=pyright
    {[base]setenv}
commands =
    # --show-diff-on-failure
    pre-commit run --all-files

[testenv:preright]
description = Run pyright
skip_install = true
deps =
    -r requirements/manage.unlock
    -r requirements/typing.in
    nodejs-wheel
    pyright
setenv =
    {[base]setenv}
commands =
    # --show-diff-on-failure
    pre-commit run --all-files pyright

# --python-version=3.10
[testenv:mypy]
description = static type checking
skip_install = true
deps =
    -r requirements/typing.in
    mypy
setenv =
    MYPY_CACHE_DIR=/tmp/.mypy_cache
    {[base]setenv}
commands =
    mypy --config-file={toxinidir}{/}pyproject.toml strictyaml-stubs

[testenv:notice]
description = create NOTICE.txt licenses.json
deps =
    pip-licenses
setenv =
    {[base]setenv}
commands =
    pip-licenses --format=plain-vertical --no-version --with-license-file --no-license-path --output-file={toxinidir}{/}NOTICE.txt -p types-strictyaml
    pip-licenses --format=json --with-authors --with-description --with-urls --no-version --output-file={toxinidir}{/}licenses.json

[testenv:sbom]
deps = cyclonedx-bom
allowlist_externals = sh
commands =
    sh -c "cat requirements/*.lock > {envtmpdir}/requirements.merged.txt"
    cyclonedx-py requirements {envtmpdir}/requirements.merged.txt -o {toxinidir}{/}sbom.json

[testenv:lint]
description = pre-commit and build
deps =
    -r requirements/dev.lock
setenv =
    {[base]setenv}
commands =
    validate-pyproject pyproject.toml
    # flake8-pyi conflicts with black. Comes down to disagreeing on lines after fcn and classes
    # in flake8, there is no --exclude-plugin
    - python -m flake8 --max-line-length=88 --extend-ignore="E701,E704,E203,E305,W503,W605,W293,W291,E301,E302,E501" strictyaml-stubs/

[testenv:format]
description = fix / enforce code formatting
deps =
    -r requirements/dev.lock
setenv =
    {[base]setenv}
commands =
    python -m isort --profile="black" --multi-line=3 --force-grid-wrap=2 --use-parentheses --trailing-comma --ensure-newline-before-comments --line-length=88 --supported-extension="pyi" strictyaml-stubs/
    python -m black --target-version=py310 --quiet --include='\.pyi?$' strictyaml-stubs/

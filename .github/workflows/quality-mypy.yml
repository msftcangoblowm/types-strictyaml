name: Quality -- mypy

on:
  push:
    branches:
    - master
    - msftcangoblowm/*
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  LOCK_SUFFIX: .lock

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  mypy:
    name: Check types -- mypy
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v6.0.2

    - name: Install Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.10'   # Minimum of PYVERSIONS, but at least 3.10
          # cache: pip
          # cache-dependency-path: |
          #  requirements/*${{ env.LOCK_SUFFIX }}

    - name: Install dependencies
      run: |
        # hashes supported by pip-tools is not supported by setuptools.
        # Don't expect hashes
        python -m pip install build wheel -r requirements/tox$LOCK_SUFFIX -r requirements/prod.unlock -r requirements/kit$LOCK_SUFFIX

      # Create generated files: version file and .lnk files. sdist tarball ignored
    - name: Build sdist to run plugins. Create generated files
      run: |
        python -m build

    - name: Tox mypy
      id: mypy_run
      run: |
        python -m tox -e mypy

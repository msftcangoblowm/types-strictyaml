# https://github.com/pyscaffold/pyscaffold/blob/master/src/pyscaffold/templates/github_ci_workflow.template
# https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts#passing-data-between-jobs-in-a-workflow

name: Quality

on:
  push:
    branches:
    - master
    - msftcangoblowm/*
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  LOCK_SUFFIX: .lock

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: flake8
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v6.0.2

    - name: Install Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.10'   # Minimum of PYVERSIONS
          # cache: pip
          # cache-dependency-path: |
          #  requirements/*${{ env.LOCK_SUFFIX }}

    - name: Install dependencies
      run: |
        python -m pip install build wheel -r requirements/tox$LOCK_SUFFIX -r requirements/prod$LOCK_SUFFIX -r requirements/kit$LOCK_SUFFIX

      # Create generated files: version file and .lnk files. sdist tarball ignored
    - name: Build sdist to run plugins. Create generated files
      run: |
        python -m build

    - name: Tox lint
      run: |
        python -m tox -e lint

  mypy:
    name: Check types -- mypy
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v6.0.2

    - name: Install Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.10'   # Minimum of PYVERSIONS, but at least 3.9
          # cache: pip
          # cache-dependency-path: |
          #  requirements/*${{ env.LOCK_SUFFIX }}

    - name: Install dependencies
      run: |
        # Runs on 3.9, but hashes supported by pip-tools is
        # not supported by setuptools. So don't expect hashes
        python -m pip install build wheel -r requirements/tox$LOCK_SUFFIX -r requirements/prod$LOCK_SUFFIX -r requirements/kit$LOCK_SUFFIX

      # Create generated files: version file and .lnk files. sdist tarball ignored
    - name: Build sdist to run plugins. Create generated files
      run: |
        python -m build

    - name: Tox mypy
      id: mypy_run
      run: |
        if python -m tox -e mypy; then
            echo "status=passed" >> $GITHUB_OUTPUT
        else
            echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Update mypy badge
      uses: RubbaBoy/BYOB@a4919104bc0ec7cfd7f113e42c405cc45246f2a4
      with:
        NAME: mypy
        LABEL: 'mypy'
        STATUS: ${{ steps.mypy_run.outputs.status }}
        COLOR: ${{ jobs.mypy.result == 'success' && 'green' || 'red' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pyright:
    name: Check types -- pyright
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v6.0.2

    - name: Install Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.10'   # Minimum of PYVERSIONS, but at least 3.9
          # cache: pip
          # cache-dependency-path: |
          #  requirements/*${{ env.LOCK_SUFFIX }}

    - name: Install dependencies
      run: |
        # Runs on 3.9, but hashes supported by pip-tools is
        # not supported by setuptools. So don't expect hashes
        python -m pip install build wheel -r requirements/tox$LOCK_SUFFIX -r requirements/prod$LOCK_SUFFIX -r requirements/kit$LOCK_SUFFIX

      # Create generated files: version file and .lnk files. sdist tarball ignored
    - name: Build sdist to run plugins. Create generated files
      run: |
        python -m build

    - name: Tox pyright
      id: pyright_run
      run: |
        if python -m tox -e pyright; then
            echo "status=passed" >> $GITHUB_OUTPUT
        else
            echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Update pyright badge
      uses: RubbaBoy/BYOB@a4919104bc0ec7cfd7f113e42c405cc45246f2a4
      with:
        NAME: pyright
        LABEL: 'pyright'
        STATUS: ${{ steps.pyright_run.outputs.status }} # Uses the job result directly
        COLOR: ${{ jobs.pyright.result == 'success' && 'green' || 'red' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rst2html5:
    name: README to html
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v6.0.2

    - name: Install Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.10'   # Minimum of PYVERSIONS
          # cache: pip
          # cache-dependency-path: |
          #  requirements/*${{ env.LOCK_SUFFIX }}

    - name: Install dependencies
      run: |
        python -m pip install build wheel -r requirements/tox$LOCK_SUFFIX

    - name: Tox rst2html5
      run: |
        python -m tox -e rst2html5
